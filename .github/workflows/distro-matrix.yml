name: Distro install matrix

# Runs the real installer (real package installs) in clean containers for each supported distro,
# then checks the result: security tools, FoxWorx install, FoxWorx running and cataloguing tools.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - fedora:41
          - archlinux:latest
          - opensuse/tumbleweed:latest
          - alpine:3.20
          - kalilinux/kali-rolling:latest
          - ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and verify
        run: bash tests/distro/run.sh "${{ matrix.image }}"
      - name: Keep the install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distro-log-${{ strategy.job-index }}
          path: tests/distro/logs/
